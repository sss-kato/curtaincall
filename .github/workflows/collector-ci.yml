name: collector-ci
on:
  pull_request:
    paths: &collector-paths # pull_request と push で同じフィルタを共有する
      ["collector/**", "data/companies.json", "app/assets/companies.json", ".github/workflows/collector-ci.yml"]
  push:
    branches: [main]
    paths: *collector-paths
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: collector/.node-version
          cache: npm
          cache-dependency-path: collector/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
