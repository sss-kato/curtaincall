# 使い捨て：D-02 §7 冒頭の目視確認 (d) ①〜⑤ を main で 1 回だけ実測する（T-52 = D-02 §10 Task J。§8 #70）。
# PR で main にマージ → gh workflow run で 1 回実行 → 別 PR で削除する。恒久的な成果物にしない。
# 外部 action は使わない（SHA 固定の対象を増やさない。§8 #52）。$GITHUB_OUTPUT へ書く値は固定語彙だけ（§8 #71 (e)）。
name: probe-collect-timeout
on:
  workflow_dispatch:
permissions: {} # 何も読み書きしない（§8 #52 と同じ既定）
concurrency:
  group: probe-collect-timeout # 本番の collect（group: collect）の待機列に入らない
  cancel-in-progress: false
jobs:
  collect: # 本番と同じジョブ名。検知ジョブの needs / if を本番と同じ字面にするため
    runs-on: ubuntu-latest
    timeout-minutes: 1 # 測定条件：ジョブ単位の timeout でキャンセルさせる
    permissions: {}
    outputs:
      before_sleep: ${{ steps.write.outputs.before_sleep }} # 測定条件 ④：outputs: の宣言（無いと needs.*.outputs は必ず空文字）
      after_sleep: ${{ steps.after.outputs.after_sleep }} # 対照：sleep の後に書く出力（キャンセルで書かれず空文字のはず）
    steps:
      - name: 出力を書く（sleep の前。測定条件 ④）
        id: write
        run: echo "before_sleep=written" >> "$GITHUB_OUTPUT"
      - name: sleep 120（timeout-minutes 1 でキャンセルされる）
        run: sleep 120
      - name: "!cancelled() のステップ（sleep の後。測定条件 ⑤。スキップされるはず）"
        id: after
        if: ${{ !cancelled() }}
        run: |
          echo "after_sleep=written" >> "$GITHUB_OUTPUT"
          echo "⑤ が成り立たない：timeout 後のジョブ内で cancelled() が偽だった"
      - name: always() のステップ（対照。キャンセル後もジョブ内のステップが評価されることを示す）
        if: ${{ always() }}
        run: echo "対照：always() のステップは実行された（cancelled() の真偽を判定材料にしない）"
  detect-collect-timeout: # 本番の collect.yml と同じ needs / if（§5.6・§8 #64）
    needs: collect
    if: ${{ !cancelled() && needs.collect.result == 'cancelled' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          RESULT: ${{ needs.collect.result }}
          BEFORE: ${{ needs.collect.outputs.before_sleep }}
          AFTER: ${{ needs.collect.outputs.after_sleep }}
        run: |
          echo "① 検知ジョブが起動した：needs.collect.result=$RESULT"
          echo "④ needs.collect.outputs.before_sleep='$BEFORE'（written なら引き渡される／空文字なら引き渡されない）"
          echo "   対照 needs.collect.outputs.after_sleep='$AFTER'（空文字のはず）"
          exit 1 # 本番と同じく明示的に失敗させる（② 実行全体の結論が failure、③ 失敗通知メール）
  observe: # 記録用。① が成り立たず検知ジョブがスキップされても、result と outputs をこのジョブで読めるようにする
    needs: collect
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          RESULT: ${{ needs.collect.result }}
          BEFORE: ${{ needs.collect.outputs.before_sleep }}
          AFTER: ${{ needs.collect.outputs.after_sleep }}
        run: |
          echo "observe：needs.collect.result=$RESULT before_sleep='$BEFORE' after_sleep='$AFTER'"
