# 使い捨て：D-02 §7 冒頭 (f)（U-11）の ⑥〜⑪ を main で実測する（§8 #81。§10 Task L。T-52 と同じ方式）。
# PR で main にマージ → gh workflow run -f mode=… を mode ごとに 1 回ずつ計 4 回実行 → 別 PR で削除する。恒久的な成果物にしない。
# 1 mode = 1 ジョブ = 測定対象のステップ 1 つ（1 回の実行に複数の形を混ぜない。D-02 §7 冒頭 (f) の「形」）。
# 外部 action は使わない（§8 #52）。$GITHUB_OUTPUT へは書かない。
name: probe-step-timeout
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "測る形（D-02 §7 冒頭 (f)）"
        type: choice
        options:
          - step-timeout-minutes
          - timeout-command
          - timeout-kill
          - timeout-production-block
permissions: {} # 何も読み書きしない（§8 #52 と同じ既定）
concurrency:
  group: probe-step-timeout # 本番の collect（group: collect）の待機列に入らない
  cancel-in-progress: false
jobs:
  step-timeout-minutes: # ⑥⑨：ステップの timeout-minutes 超過時の結論とメール（(d-1)）
    if: ${{ inputs.mode == 'step-timeout-minutes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10 # ジョブの上限には掛けない
    permissions: {}
    steps:
      - name: sleep 120（ステップの timeout-minutes 1 で止まる）
        timeout-minutes: 1
        run: sleep 120
  timeout-command: # ⑦⑧：coreutils timeout の終了コード 124 と結論・メール（(d-2)）
    if: ${{ inputs.mode == 'timeout-command' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: timeout -k 5s 30s sleep 120（終了コード 124 のはず）
        run: timeout -k 5s 30s sleep 120
  timeout-kill: # ⑩：SIGTERM を無視させ -k の SIGKILL まで進める（終了コード 137 のはず）
    if: ${{ inputs.mode == 'timeout-kill' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: timeout -k 5s 10s（SIGTERM 無視）
        run: timeout -k 5s 10s bash -c 'trap "" TERM; sleep 120'
  timeout-production-block: # ⑪：D-02 §5.6 の 収集・差分・確定・通知 の run: ブロックの写し（npm start → sh -c 'sleep 120'）
    if: ${{ inputs.mode == 'timeout-production-block' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: 収集・差分・確定・通知（写し）
        env:
          STEP_TIMEOUT: 30s
          STEP_KILL_AFTER: 5s
        run: |
          status=0
          timeout -k "$STEP_KILL_AFTER" "$STEP_TIMEOUT" sh -c 'sleep 120' || status=$?
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "収集・差分・確定・通知 を上限（STEP_TIMEOUT=$STEP_TIMEOUT）で打ち切った（終了コード $status）。確認先：通知の送信（D-02 §5.4。待機上限を持たない。§8 #91）、通知ゲートウェイの解放（D-02 §5.5 main.ts 手順 11・§5.4 の CLOSE_TIMEOUT_MS）、情報源の応答時間（§5.7 の timeoutMs）、git push のハング（§5.3 手順 3-5 の GIT_TIMEOUT_MS）" >&2
            echo "収集・差分・確定・通知 を上限で打ち切った（終了コード $status）。push の有無はログではなく main の最新コミット（作者 github-actions[bot]・件名の generatedAt がこの実行の開始以降か）で判定する。push 済みなら未送信の通知は再送されない（D-02 §6）" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
