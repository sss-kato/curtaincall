name: curtaincall
description: "CurtainCall: 舞台・ミュージカル公式情報のニュースアグリゲーター"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  flutter:
    sdk: flutter
  # CupertinoApp の GlobalCupertinoLocalizations に必要 (D-04 §5.9)
  flutter_localizations:
    sdk: flutter
  # riverpod 系を更新するときは analysis_options.yaml の plugins: riverpod_lint も同時に上げる（完全一致固定のため）
  flutter_riverpod: ^3.0.0
  http: ^1.2.0
  logger: ^2.4.0
  # TODO(T-18): D-04 §4.1・§4.8 に @immutable / meta 依存を追記したら
  # このコメントを消す。
  meta: ^1.18.0
  riverpod_annotation: ^3.0.0

dev_dependencies:
  build_runner: ^2.4.0
  drift_dev: ^2.20.0
  # SyncCoordinator の全体タイムアウトのテストで使う（D-04 §7）。
  fake_async: ^1.3.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^3.0.0
  # riverpod_lint 3.1.0 以降は analyzer 公式の analysis_server_plugin 方式へ恒久移行し、
  # custom_lint への依存が無くなった。pubspec の依存解決とは独立して analyzer が
  # analysis_options.yaml の `plugins:` からバージョンを解決するため、ここには追加しない。
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/companies.json
